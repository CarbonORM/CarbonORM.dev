apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbonorm-docs
  namespace: carbonorm
  labels:
    app.kubernetes.io/name: carbonorm-docs
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: carbonorm-docs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carbonorm-docs
    spec:
      initContainers:
        - name: build-docs
          image: node:24-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apk add --no-cache git
              git clone --depth 1 --branch www https://github.com/CarbonORM/CarbonORM.dev.git /tmp/source
              cd /tmp/source
              npm ci --legacy-peer-deps --ignore-scripts
              npm run build:actions
              cp -a build/. /site/
          volumeMounts:
            - name: site
              mountPath: /site
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      containers:
        - name: docs
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
      volumes:
        - name: site
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: carbonorm-docs-nginx

apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbonorm-docs
  namespace: carbonorm
  labels:
    app.kubernetes.io/name: carbonorm-docs
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: carbonorm-docs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carbonorm-docs
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: docs
          image: ghcr.io/carbonorm/carbonorm.dev:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi

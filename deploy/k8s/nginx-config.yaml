apiVersion: v1
kind: ConfigMap
metadata:
  name: carbonorm-docs-nginx
  namespace: carbonorm
  labels:
    app.kubernetes.io/name: carbonorm-docs
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
      }
    }

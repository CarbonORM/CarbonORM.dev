name: Build

on:
  push:
    branches:
      - www
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build static docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build:actions
